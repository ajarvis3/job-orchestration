apiVersion: v1
kind: Service
metadata:
  name: {{ include "job-orchestration.componentName" (dict "Release" .Release "component" "orchestrator") }}
  labels:
    {{- include "job-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  type: {{ .Values.orchestrator.service.type }}
  selector:
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.orchestrator.service.port }}
      targetPort: {{ .Values.orchestrator.service.targetPort }}

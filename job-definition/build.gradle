plugins {
    id 'java-library'
}

group = 'com.joborchestration'
version = '0.0.1-SNAPSHOT'
description = 'Shared job contract types for the job orchestration platform'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api 'jakarta.validation:jakarta.validation-api:3.1.1'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
